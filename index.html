<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab4c question 2</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

    <script>
        $.getJSON("books.json", function(data) {
            console.log("Title of first book: " + data.books[0].title);
            console.log("Author of second book: " + data.books[1].author);
            console.log("Genres of all books:");
            $.each(data.books, function(index, book) {
                console.log("Book " + (index + 1) + " Genres: " + book.genres.join(", "));
            });
        });
    </script>
</body>
</html>
